name: UI Role Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  buyer-role-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_URL: https://scrap-ai.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for buyer/seller UI deployment
        shell: bash
        run: |
          for i in $(seq 1 24); do
            js="$(curl -fsSL "$PRODUCTION_URL/production-client.js" || true)"
            if echo "$js" | grep -q 'id="prodBuyTab"' && echo "$js" | grep -q 'buyerWelcome'; then
              echo "Role-safe UI is live"
              exit 0
            fi
            echo "Attempt $i/24: waiting for Vercel production"
            sleep 15
          done
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real buyer browser journey
        run: node scripts/ui-role-smoke.mjs
